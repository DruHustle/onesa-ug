worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 512; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    client_max_body_size 16k;
    client_body_timeout 15s;
    client_header_timeout 10s;
    keepalive_timeout 15s;

    # $uri excludes query strings, including authorization codes. API logging is disabled below.
    log_format basic '$request_method $uri $status $body_bytes_sent $request_time';
    access_log /dev/stdout basic;
    limit_req_zone $binary_remote_addr zone=api_per_client:10m rate=12r/s;
    limit_req_zone $binary_remote_addr zone=signin_per_client:1m rate=10r/m;
    limit_req_status 429;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy 'camera=(), microphone=(), geolocation=()' always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

        location = /healthz {
            access_log off;
            default_type application/json;
            return 200 '{"status":"ok","component":"web"}';
        }

        location = /api/v1/session/login {
            access_log off;
            error_log /dev/null crit;
            limit_req zone=signin_per_client burst=10 nodelay;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://api:4000/v1/session/login;
            proxy_connect_timeout 3s;
            proxy_read_timeout 20s;
            proxy_send_timeout 20s;
            proxy_buffering off;
        }

        location /api/ {
            access_log off;
            # Proxy errors can contain the original authorization-code query string.
            # Backend failures use sanitized request IDs; never log raw API URLs here.
            error_log /dev/null crit;
            limit_req zone=api_per_client burst=40 nodelay;
            proxy_set_header Host $host;
            # Overwrite, never append an untrusted forwarding chain.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://api:4000/;
            proxy_connect_timeout 3s;
            proxy_read_timeout 20s;
            proxy_send_timeout 20s;
            proxy_buffering off;
        }

        location ~ /\. { deny all; }
        location /assets/ {
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control 'public, immutable';
            add_header X-Content-Type-Options nosniff always;
        }
        location / {
            add_header Cache-Control 'no-store';
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy no-referrer always;
            add_header Permissions-Policy 'camera=(), microphone=(), geolocation=()' always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
            try_files $uri $uri/ /index.html;
        }
    }
}
