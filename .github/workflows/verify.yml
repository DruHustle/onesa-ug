# Generated by scripts/ci/generate_workflows.py; edit source inputs and regenerate.
name: Onesa verification
'on':
  push:
    branches:
    - dev
    - staging
    - main
  pull_request:
    branches:
    - dev
    - staging
    - main
  schedule:
  - cron: 17 6 * * 1
  workflow_dispatch: {}
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: onesa-verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      portal: ${{ steps.paths.outputs.portal }}
      platform: ${{ steps.paths.outputs.platform }}
      robot: ${{ steps.paths.outputs.robot }}
      drone: ${{ steps.paths.outputs.drone }}
    steps:
    - name: Verify hosted execution, visibility and included-allowance policy
      env:
        GH_TOKEN: ${{ github.token }}
        EXPECTED_PRIVATE: ${{ github.event.repository.private }}
        PRIVATE_VALIDATION_ENABLED: ${{ vars.ONESA_PRIVATE_HOSTED_VALIDATION_ENABLED }}
      run: |
        test "$RUNNER_ENVIRONMENT" = github-hosted
        actual=$(gh api "repos/$GITHUB_REPOSITORY" --jq ".private")
        test "$actual" = "$EXPECTED_PRIVATE" || { echo "Repository visibility changed"; exit 1; }
        if [ "$actual" = true ] && [ "$PRIVATE_VALIDATION_ENABLED" != true ]; then
          echo "Private hosted verification requires explicit included-allowance opt-in"
          exit 1
        fi
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        fetch-depth: 0
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.11'
    - name: Install the existing hash-locked workflow parser
      run: python -m pip install --require-hashes --no-deps -r scripts/ci/requirements.lock
    - name: Check generated verification and regression boundaries
      run: |
        python scripts/ci/generate_workflows.py --check
        python -m unittest discover -s scripts/ci -p 'test_*.py'
    - name: Scan the consolidated index and publishable working files
      run: python scripts/repository_hygiene.py
    - id: paths
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      run: python scripts/ci/selection.py
  pipeline-security:
    needs:
    - prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        fetch-depth: 0
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.11'
    - name: Install checksum-locked offline security tools
      run: python3 onesa-company-portal/scripts/ci/install_tools.py --only actionlint zizmor gitleaks
    - name: Check active root workflows and repository secrets
      run: python3 scripts/ci/security.py --output "$RUNNER_TEMP/monorepo-security/record.json"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: always()
      with:
        name: monorepo-pipeline-security
        path: ${{ runner.temp }}/monorepo-security/record.json
        retention-days: 3
        if-no-files-found: error
  portal:
    needs:
    - prepare
    if: needs.prepare.result == 'success' && needs.prepare.outputs.portal == 'true'
    uses: ./.github/workflows/_verify-portal.yml
    permissions:
      contents: read
      pull-requests: read
  platform:
    needs:
    - prepare
    if: needs.prepare.result == 'success' && needs.prepare.outputs.platform == 'true'
    uses: ./.github/workflows/_verify-platform.yml
    permissions:
      contents: read
      pull-requests: read
  robot:
    needs:
    - prepare
    if: needs.prepare.result == 'success' && needs.prepare.outputs.robot == 'true'
    uses: ./.github/workflows/_verify-robot.yml
    permissions:
      contents: read
      pull-requests: read
  drone:
    needs:
    - prepare
    if: needs.prepare.result == 'success' && needs.prepare.outputs.drone == 'true'
    uses: ./.github/workflows/_verify-drone.yml
    permissions:
      contents: read
      pull-requests: read
  ci-summary:
    name: Onesa required verification
    if: always()
    needs:
    - prepare
    - pipeline-security
    - portal
    - platform
    - robot
    - drone
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Reject failed, missing, cancelled or unexpectedly skipped gates
      env:
        CI_RESULTS: ${{ toJSON(needs) }}
      run: python3 scripts/ci/summary.py
